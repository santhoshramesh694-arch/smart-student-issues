<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security &amp; Audit Trail | Admin Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="p-4 p-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <div>
            <h3 class="fw-bold text-dark mb-1">Administrative Audit Trail</h3>
            <p class="text-secondary small mb-0">Immutable compliance log recording user logins, ticket transitions, dispatches, and modifications.</p>
          </div>
          <button class="btn btn-outline-primary" onclick="loadAuditLogs()">
            <i class="fa-solid fa-arrows-rotate me-1"></i>Refresh Log
          </button>
        </div>

        <!-- Filter Bar -->
        <div class="card-custom p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="fa-solid fa-search"></i></span>
                <input type="text" class="form-control border-start-0" id="audit-search" placeholder="Search action, details, user, or IP...">
              </div>
            </div>

            <div class="col-6 col-md-3">
              <select class="form-select" id="action-filter">
                <option value="">All Activity Types</option>
                <option value="USER_LOGIN">User Logins</option>
                <option value="USER_REGISTER">Registrations</option>
                <option value="ISSUE_CREATED">Issue Creations</option>
                <option value="ISSUE_ASSIGNED">Issue Assignments</option>
                <option value="STATUS_CHANGED">Status Transitions</option>
                <option value="ISSUE_RESOLVED">Issue Resolutions</option>
                <option value="FEEDBACK_SUBMITTED">Feedback Submissions</option>
                <option value="CATEGORY_CREATED">Category Changes</option>
              </select>
            </div>

            <div class="col-6 col-md-2">
              <select class="form-select" id="entity-filter">
                <option value="">All Entities</option>
                <option value="ISSUE">Issues</option>
                <option value="USER">Users</option>
                <option value="FEEDBACK">Feedback</option>
                <option value="CATEGORY">Categories</option>
              </select>
            </div>

            <div class="col-12 col-md-2 text-end">
              <button class="btn btn-outline-secondary w-100" onclick="resetAuditFilters()">
                <i class="fa-solid fa-rotate-left me-1"></i>Reset
              </button>
            </div>
          </div>
        </div>

        <!-- Audit Table -->
        <div class="card-custom">
          <div class="table-responsive">
            <table class="table table-custom">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Actor / User</th>
                  <th>Action Triggered</th>
                  <th>Target Entity</th>
                  <th>IP Address</th>
                  <th>Details &amp; Audit Payload</th>
                </tr>
              </thead>
              <tbody id="audit-tbody">
                <tr>
                  <td colspan="6" class="text-center py-5 text-muted small">
                    <span class="spinner-border spinner-border-sm me-2"></span>Loading audit trail...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="p-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="small text-muted" id="audit-pagination-info">Showing 0 records</div>
            <ul class="pagination pagination-sm mb-0" id="audit-pagination-controls"></ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let auditPage = 1;

    if (Auth.requireAuth(['admin'])) {
      Components.renderLayout('audit-logs');
      loadAuditLogs();
      setupEvents();
    }

    function setupEvents() {
      let debounce;
      document.getElementById('audit-search').addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { auditPage = 1; loadAuditLogs(); }, 350);
      });
      document.getElementById('action-filter').addEventListener('change', () => { auditPage = 1; loadAuditLogs(); });
      document.getElementById('entity-filter').addEventListener('change', () => { auditPage = 1; loadAuditLogs(); });
    }

    function resetAuditFilters() {
      document.getElementById('audit-search').value = '';
      document.getElementById('action-filter').value = '';
      document.getElementById('entity-filter').value = '';
      auditPage = 1;
      loadAuditLogs();
    }

    async function loadAuditLogs() {
      const search = document.getElementById('audit-search').value.trim();
      const action = document.getElementById('action-filter').value;
      const entity_type = document.getElementById('entity-filter').value;

      const params = new URLSearchParams({
        page: auditPage,
        limit: 15
      });
      if (search) params.append('search', search);
      if (action) params.append('action', action);
      if (entity_type) params.append('entity_type', entity_type);

      try {
        const res = await apiCall(`/audit-logs?${params.toString()}`);
        const { logs, pagination } = res.data;
        const tbody = document.getElementById('audit-tbody');

        if (!logs || logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6">${UI.renderEmptyState('No audit records match filters')}</td></tr>`;
          document.getElementById('audit-pagination-info').textContent = 'Showing 0 records';
          document.getElementById('audit-pagination-controls').innerHTML = '';
          return;
        }

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td class="small text-secondary text-nowrap">${UI.formatDateTime(l.created_at)}</td>
            <td>
              ${l.user_name ? `
                <div class="fw-bold text-dark small">${UI.escapeHTML(l.user_name)}</div>
                <div class="text-muted small">${UI.escapeHTML(l.user_email || '')} (${l.user_role || 'user'})</div>
              ` : '<span class="text-muted small">System Process</span>'}
            </td>
            <td>
              <span class="badge bg-light text-dark border font-monospace small">${UI.escapeHTML(l.action)}</span>
            </td>
            <td>
              <span class="badge bg-secondary-subtle text-secondary small">${UI.escapeHTML(l.entity_type)} #${l.entity_id || ''}</span>
            </td>
            <td><code class="small text-muted">${UI.escapeHTML(l.ip_address || '127.0.0.1')}</code></td>
            <td class="small text-secondary" style="max-width: 320px;">
              ${UI.escapeHTML(l.details || '-')}
            </td>
          </tr>
        `).join('');

        document.getElementById('audit-pagination-info').textContent = `Showing page ${pagination.page} of ${pagination.totalPages} (${pagination.total} total logs)`;
        renderAuditPagination(pagination.page, pagination.totalPages);

      } catch (err) {
        UI.showToast('Failed to load audit logs: ' + err.message, 'danger');
      }
    }

    function renderAuditPagination(page, totalPages) {
      const controls = document.getElementById('audit-pagination-controls');
      controls.innerHTML = '';
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${page === i ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.onclick = (e) => { e.preventDefault(); auditPage = i; loadAuditLogs(); };
        controls.appendChild(li);
      }
    }
  </script>
</body>
</html>
