<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories | Admin Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="p-4 p-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <div>
            <h3 class="fw-bold text-dark mb-1">Campus Issue Taxonomy</h3>
            <p class="text-secondary small mb-0">Create, customize, and configure grievance classification categories.</p>
          </div>
          <button class="btn btn-primary px-4 fw-semibold shadow-sm" onclick="openAddCatModal()">
            <i class="fa-solid fa-plus-circle me-2"></i>Add Category
          </button>
        </div>

        <div class="card-custom">
          <div class="table-responsive">
            <table class="table table-custom">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Icon Identifier</th>
                  <th>Active Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="categories-tbody">
                <tr>
                  <td colspan="5" class="text-center py-5 text-muted small">
                    <span class="spinner-border spinner-border-sm me-2"></span>Loading categories...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Category Modal -->
  <div class="modal fade" id="catModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-dark" id="catModalTitle">Create Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="cat-form">
            <input type="hidden" id="edit-cat-id">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Category Name *</label>
              <input type="text" class="form-control" id="cat-name" required placeholder="e.g. Solar Power / Renewable">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">FontAwesome Icon Class *</label>
              <input type="text" class="form-control" id="cat-icon" required placeholder="e.g. fa-solar-panel or fa-bolt">
              <div class="text-muted small mt-1" style="font-size: 0.725rem;">Standard FontAwesome 6 icon class name.</div>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold text-secondary">Operational Scope Description</label>
              <textarea class="form-control" id="cat-desc" rows="3" placeholder="Brief outline of issues falling under this domain..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="save-cat-btn">
              Save Category
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let catModalInst = null;

    if (Auth.requireAuth(['admin'])) {
      Components.renderLayout('categories');
      loadCategories();
      setupCatForm();
    }

    async function loadCategories() {
      try {
        const res = await apiCall('/categories?all=true');
        const { categories } = res.data;
        const tbody = document.getElementById('categories-tbody');

        tbody.innerHTML = categories.map(c => `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-3">
                <div class="rounded-circle bg-light border d-flex align-items-center justify-content-center text-primary" style="width: 40px; height: 40px; font-size: 1.1rem;">
                  <i class="fa-solid ${UI.escapeHTML(c.icon || 'fa-wrench')}"></i>
                </div>
                <span class="fw-bold text-dark">${UI.escapeHTML(c.name)}</span>
              </div>
            </td>
            <td class="text-secondary small" style="max-width: 320px;">${UI.escapeHTML(c.description || 'No description')}</td>
            <td><code class="small text-muted">${UI.escapeHTML(c.icon)}</code></td>
            <td>
              ${c.is_active ? '<span class="badge bg-success-subtle text-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.id}, '${c.name}')" title="Deactivate/Delete">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        UI.showToast('Failed to load categories: ' + err.message, 'danger');
      }
    }

    function openAddCatModal() {
      document.getElementById('edit-cat-id').value = '';
      document.getElementById('cat-form').reset();
      document.getElementById('cat-icon').value = 'fa-wrench';
      document.getElementById('catModalTitle').textContent = 'Create Category';
      catModalInst = new bootstrap.Modal(document.getElementById('catModal'));
      catModalInst.show();
    }

    function setupCatForm() {
      document.getElementById('cat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-cat-id').value;
        const name = document.getElementById('cat-name').value.trim();
        const icon = document.getElementById('cat-icon').value.trim();
        const description = document.getElementById('cat-desc').value.trim();

        try {
          if (id) {
            await apiCall(`/categories/${id}`, {
              method: 'PUT',
              body: JSON.stringify({ name, icon, description })
            });
            UI.showToast('Category updated!', 'success');
          } else {
            await apiCall('/categories', {
              method: 'POST',
              body: JSON.stringify({ name, icon, description })
            });
            UI.showToast('Category created successfully!', 'success');
          }

          if (catModalInst) catModalInst.hide();
          loadCategories();
        } catch (err) {
          UI.showToast(err.message, 'danger');
        }
      });
    }

    async function deleteCategory(id, name) {
      if (!confirm(`Are you sure you want to deactivate or remove category "${name}"?`)) return;
      try {
        const res = await apiCall(`/categories/${id}`, { method: 'DELETE' });
        UI.showToast(res.message || 'Category status updated', 'success');
        loadCategories();
      } catch (err) {
        UI.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
