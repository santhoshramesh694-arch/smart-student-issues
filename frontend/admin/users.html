<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory &amp; Staff Roles | Admin Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="p-4 p-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <div>
            <h3 class="fw-bold text-dark mb-1">Campus User &amp; Staff Directory</h3>
            <p class="text-secondary small mb-0">Manage student profiles, dispatch technician accounts, and administrative access.</p>
          </div>
          <button class="btn btn-primary px-4 fw-semibold shadow-sm" onclick="openAddUserModal()">
            <i class="fa-solid fa-user-plus me-2"></i>Add User
          </button>
        </div>

        <!-- Filter Bar -->
        <div class="card-custom p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="fa-solid fa-search"></i></span>
                <input type="text" class="form-control border-start-0" id="user-search" placeholder="Search by name, email, roll number, or employee ID...">
              </div>
            </div>

            <div class="col-6 col-md-4">
              <select class="form-select" id="role-filter">
                <option value="">All Roles (Students, Staff, Admins)</option>
                <option value="student">Students Only</option>
                <option value="staff">Maintenance Staff Only</option>
                <option value="admin">Administrators Only</option>
              </select>
            </div>

            <div class="col-6 col-md-2 text-end">
              <button class="btn btn-outline-secondary w-100" onclick="resetUserFilters()">
                <i class="fa-solid fa-rotate-left me-1"></i>Reset
              </button>
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="card-custom">
          <div class="table-responsive">
            <table class="table table-custom">
              <thead>
                <tr>
                  <th>User Identity</th>
                  <th>Role</th>
                  <th>Department / Designation</th>
                  <th>Contact Info</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-tbody">
                <tr>
                  <td colspan="7" class="text-center py-5 text-muted small">
                    <span class="spinner-border spinner-border-sm me-2"></span>Loading user directory...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="p-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="small text-muted" id="user-pagination-info">Showing 0 records</div>
            <ul class="pagination pagination-sm mb-0" id="user-pagination-controls"></ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-dark"><i class="fa-solid fa-user-plus me-2 text-primary"></i>Provision New Account</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="add-user-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-secondary">Full Name *</label>
                <input type="text" class="form-control" id="add-name" required placeholder="Dr. Robert Smith">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-secondary">Campus Email *</label>
                <input type="email" class="form-control" id="add-email" required placeholder="r.smith@smartcampus.edu">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-secondary">Initial Password *</label>
                <input type="password" class="form-control" id="add-password" required minlength="6" placeholder="••••••••">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-secondary">System Role *</label>
                <select class="form-select" id="add-role" required onchange="toggleRoleFields()">
                  <option value="staff" selected>Maintenance Staff</option>
                  <option value="student">Student</option>
                  <option value="admin">Administrator</option>
                </select>
              </div>

              <!-- Staff Specific Fields -->
              <div class="col-md-6 role-field-staff">
                <label class="form-label small fw-bold text-secondary">Employee ID</label>
                <input type="text" class="form-control" id="add-empid" placeholder="EMP-2026-09">
              </div>
              <div class="col-md-6 role-field-staff">
                <label class="form-label small fw-bold text-secondary">Staff Department</label>
                <input type="text" class="form-control" id="add-staff-dept" placeholder="Electrical & Power Maintenance">
              </div>
              <div class="col-md-6 role-field-staff">
                <label class="form-label small fw-bold text-secondary">Designation</label>
                <input type="text" class="form-control" id="add-desig" placeholder="Senior Systems Technician">
              </div>
              <div class="col-md-6 role-field-staff">
                <label class="form-label small fw-bold text-secondary">Specialization</label>
                <input type="text" class="form-control" id="add-spec" placeholder="Substation Diagnostics">
              </div>

              <!-- Student Specific Fields -->
              <div class="col-md-6 role-field-student d-none">
                <label class="form-label small fw-bold text-secondary">Roll Number</label>
                <input type="text" class="form-control" id="add-roll" placeholder="CS2026099">
              </div>
              <div class="col-md-6 role-field-student d-none">
                <label class="form-label small fw-bold text-secondary">Academic Department</label>
                <input type="text" class="form-control" id="add-student-dept" placeholder="Computer Science">
              </div>
            </div>

            <div class="mt-4 text-end">
              <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary px-4 fw-semibold" id="confirm-add-btn">
                Create User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let userCurrentPage = 1;
    let addModalInst = null;

    if (Auth.requireAuth(['admin'])) {
      Components.renderLayout('users');
      loadUsers();
      setupEvents();
    }

    function setupEvents() {
      let debounce;
      document.getElementById('user-search').addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { userCurrentPage = 1; loadUsers(); }, 350);
      });
      document.getElementById('role-filter').addEventListener('change', () => {
        userCurrentPage = 1;
        loadUsers();
      });

      document.getElementById('add-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = document.getElementById('add-role').value;
        const btn = document.getElementById('confirm-add-btn');
        btn.disabled = true;

        const payload = {
          full_name: document.getElementById('add-name').value.trim(),
          email: document.getElementById('add-email').value.trim(),
          password: document.getElementById('add-password').value,
          role,
          employee_id: document.getElementById('add-empid').value.trim(),
          department: role === 'student' ? document.getElementById('add-student-dept').value.trim() : document.getElementById('add-staff-dept').value.trim(),
          designation: document.getElementById('add-desig').value.trim(),
          specialization: document.getElementById('add-spec').value.trim(),
          roll_number: document.getElementById('add-roll').value.trim()
        };

        try {
          await apiCall('/users', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          if (addModalInst) addModalInst.hide();
          UI.showToast(`User ${payload.email} created!`, 'success');
          document.getElementById('add-user-form').reset();
          loadUsers();
        } catch (err) {
          UI.showToast(err.message, 'danger');
        } finally {
          btn.disabled = false;
        }
      });
    }

    function toggleRoleFields() {
      const role = document.getElementById('add-role').value;
      const staffFields = document.querySelectorAll('.role-field-staff');
      const studentFields = document.querySelectorAll('.role-field-student');

      if (role === 'student') {
        staffFields.forEach(el => el.classList.add('d-none'));
        studentFields.forEach(el => el.classList.remove('d-none'));
      } else if (role === 'staff') {
        staffFields.forEach(el => el.classList.remove('d-none'));
        studentFields.forEach(el => el.classList.add('d-none'));
      } else {
        staffFields.forEach(el => el.classList.add('d-none'));
        studentFields.forEach(el => el.classList.add('d-none'));
      }
    }

    function openAddUserModal() {
      addModalInst = new bootstrap.Modal(document.getElementById('addUserModal'));
      addModalInst.show();
    }

    function resetUserFilters() {
      document.getElementById('user-search').value = '';
      document.getElementById('role-filter').value = '';
      userCurrentPage = 1;
      loadUsers();
    }

    async function loadUsers() {
      const search = document.getElementById('user-search').value.trim();
      const role = document.getElementById('role-filter').value;

      const params = new URLSearchParams({
        page: userCurrentPage,
        limit: 10
      });
      if (search) params.append('search', search);
      if (role) params.append('role', role);

      try {
        const res = await apiCall(`/users?${params.toString()}`);
        const { users, pagination } = res.data;
        const tbody = document.getElementById('users-table-tbody');

        if (!users || users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7">${UI.renderEmptyState('No users found')}</td></tr>`;
          document.getElementById('user-pagination-info').textContent = 'Showing 0 records';
          document.getElementById('user-pagination-controls').innerHTML = '';
          return;
        }

        tbody.innerHTML = users.map(u => {
          let roleBadge = '<span class="badge bg-secondary">User</span>';
          if (u.role === 'admin') roleBadge = '<span class="badge bg-danger">Admin</span>';
          else if (u.role === 'staff') roleBadge = '<span class="badge bg-primary">Staff</span>';
          else if (u.role === 'student') roleBadge = '<span class="badge bg-success">Student</span>';

          let deptInfo = u.staff_department || u.student_department || 'General Campus';
          let idBadge = u.employee_id || u.roll_number ? `<span class="small text-muted font-monospace">${u.employee_id || u.roll_number}</span>` : '';

          return `
            <tr>
              <td>
                <div class="fw-bold text-dark">${UI.escapeHTML(u.full_name)}</div>
                <div class="text-secondary small">${UI.escapeHTML(u.email)}</div>
              </td>
              <td>${roleBadge}</td>
              <td>
                <div class="small fw-semibold text-dark">${UI.escapeHTML(deptInfo)}</div>
                ${idBadge}
              </td>
              <td>
                <div class="small text-muted"><i class="fa-solid fa-phone me-1"></i>${UI.escapeHTML(u.phone || 'N/A')}</div>
              </td>
              <td>
                ${u.is_active ? '<span class="badge bg-success-subtle text-success">Active</span>' : '<span class="badge bg-danger-subtle text-danger">Deactivated</span>'}
              </td>
              <td class="small text-secondary">${UI.formatDate(u.created_at)}</td>
              <td class="text-end">
                ${u.is_active ? `
                  <button class="btn btn-sm btn-outline-danger" onclick="deactivateUser(${u.id}, '${u.full_name}')" title="Deactivate">
                    <i class="fa-solid fa-ban"></i>
                  </button>
                ` : '<span class="text-muted small">Disabled</span>'}
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('user-pagination-info').textContent = `Showing page ${pagination.page} of ${pagination.totalPages} (${pagination.total} total)`;
        renderUserPagination(pagination.page, pagination.totalPages);

      } catch (err) {
        UI.showToast('Failed to load users: ' + err.message, 'danger');
      }
    }

    async function deactivateUser(id, name) {
      if (!confirm(`Are you sure you want to deactivate the account for ${name}?`)) return;
      try {
        await apiCall(`/users/${id}`, { method: 'DELETE' });
        UI.showToast(`Account for ${name} deactivated`, 'success');
        loadUsers();
      } catch (err) {
        UI.showToast(err.message, 'danger');
      }
    }

    function renderUserPagination(page, totalPages) {
      const controls = document.getElementById('user-pagination-controls');
      controls.innerHTML = '';
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${page === i ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.onclick = (e) => { e.preventDefault(); userCurrentPage = i; loadUsers(); };
        controls.appendChild(li);
      }
    }
  </script>
</body>
</html>
