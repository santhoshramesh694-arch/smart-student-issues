<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Smart Campus Management System</title>
  <meta name="description" content="Sign in to the Smart Campus Issue & Resource Management System portal for Students, Staff, and Administrators.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">

  <div class="container" style="max-width: 460px;">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="p-4 p-sm-5 bg-white">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
          <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
            <span class="brand-badge"><i class="fa-solid fa-graduation-cap"></i></span>
            <span class="fw-bold text-dark fs-4">SmartCampus</span>
          </a>
          <h4 class="fw-bold text-dark mb-1">Welcome back</h4>
          <p class="text-secondary small mb-0">Sign in to your campus governance account</p>
        </div>

        <!-- Alert messages container -->
        <div id="login-alert" class="alert d-none py-2 small" role="alert"></div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label small fw-semibold text-secondary">Campus Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" class="form-control border-start-0" id="email" placeholder="name@smartcampus.edu" required autocomplete="email">
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="••••••••" required autocomplete="current-password">
              <button class="btn btn-outline-light text-muted border border-start-0" type="button" id="toggle-pw" onclick="togglePasswordVisibility()">
                <i class="fa-solid fa-eye" id="toggle-pw-icon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" id="submit-btn">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
          </button>
        </form>

        <!-- Demo Accounts Quickfill Section -->
        <div class="mt-4 pt-3 border-top">
          <div class="text-center text-muted small fw-semibold mb-2">QUICK-FILL DEMO CREDENTIALS</div>
          <div class="d-grid gap-2">
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between px-3" onclick="fillCredentials('admin@smartcampus.edu', 'Admin@123')">
              <span><i class="fa-solid fa-user-shield text-danger me-2"></i><strong>Admin:</strong> Campus Chief</span>
              <span class="badge bg-secondary">Fill</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between px-3" onclick="fillCredentials('staff.it@smartcampus.edu', 'Staff@123')">
              <span><i class="fa-solid fa-screwdriver-wrench text-info me-2"></i><strong>Staff:</strong> Systems Tech</span>
              <span class="badge bg-secondary">Fill</span>
            </button>
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-between px-3" onclick="fillCredentials('student1@smartcampus.edu', 'Student@123')">
              <span><i class="fa-solid fa-graduation-cap text-primary me-2"></i><strong>Student:</strong> Alex Johnson</span>
              <span class="badge bg-secondary">Fill</span>
            </button>
          </div>
        </div>

        <div class="text-center mt-4 pt-2 small text-secondary">
          New Student? <a href="/register.html" class="text-primary fw-semibold text-decoration-none">Register Account</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // Check if session expired query parameter is present
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      const alertBox = document.getElementById('login-alert');
      alertBox.className = 'alert alert-warning py-2 small';
      alertBox.textContent = 'Your session has expired. Please sign in again.';
      alertBox.classList.remove('d-none');
    } else if (urlParams.get('logged_out')) {
      const alertBox = document.getElementById('login-alert');
      alertBox.className = 'alert alert-info py-2 small';
      alertBox.textContent = 'You have signed out successfully.';
      alertBox.classList.remove('d-none');
    }

    function togglePasswordVisibility() {
      const pwInput = document.getElementById('password');
      const icon = document.getElementById('toggle-pw-icon');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pwInput.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('login-alert');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      try {
        const response = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        const { token, user } = response.data;
        Auth.setSession(token, user);
        UI.showToast(`Welcome back, ${user.full_name}!`, 'success');

        setTimeout(() => {
          if (user.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else if (user.role === 'staff') {
            window.location.href = '/staff/dashboard.html';
          } else {
            window.location.href = '/student/dashboard.html';
          }
        }, 500);

      } catch (err) {
        alertBox.className = 'alert alert-danger py-2 small';
        alertBox.textContent = err.message || 'Login failed. Please check credentials.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Sign In';
      }
    });
  </script>
</body>
</html>
