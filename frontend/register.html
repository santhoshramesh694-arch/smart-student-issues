<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Smart Campus Management System</title>
  <meta name="description" content="Register as a student in the Smart Campus system to report facilities grievances, track work orders, and submit satisfaction feedback.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="py-5" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">

  <div class="container" style="max-width: 680px;">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="p-4 p-sm-5 bg-white">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
          <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
            <span class="brand-badge"><i class="fa-solid fa-graduation-cap"></i></span>
            <span class="fw-bold text-dark fs-4">SmartCampus</span>
          </a>
          <h4 class="fw-bold text-dark mb-1">Student Account Registration</h4>
          <p class="text-secondary small mb-0">Create your credentials to track issues and manage campus facilities</p>
        </div>

        <div id="register-alert" class="alert d-none py-2 small" role="alert"></div>

        <form id="register-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="full_name" class="form-label small fw-semibold text-secondary">Full Name *</label>
              <input type="text" class="form-control" id="full_name" placeholder="John Doe" required>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label small fw-semibold text-secondary">Campus Email *</label>
              <input type="email" class="form-control" id="email" placeholder="john.doe@smartcampus.edu" required>
            </div>

            <div class="col-md-6">
              <label for="password" class="form-label small fw-semibold text-secondary">Password * (Min 6 chars)</label>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label small fw-semibold text-secondary">Phone Number</label>
              <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 0199">
            </div>

            <div class="col-md-6">
              <label for="roll_number" class="form-label small fw-semibold text-secondary">Roll / Student ID *</label>
              <input type="text" class="form-control" id="roll_number" placeholder="CS2026042" required>
            </div>

            <div class="col-md-6">
              <label for="department" class="form-label small fw-semibold text-secondary">Department *</label>
              <select class="form-select" id="department" required>
                <option value="" selected disabled>Select Department</option>
                <option value="Computer Science & Engineering">Computer Science &amp; Engineering</option>
                <option value="Electronics & Communication">Electronics &amp; Communication</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Electrical & Electronics">Electrical &amp; Electronics</option>
                <option value="Biotechnology">Biotechnology</option>
                <option value="Business Administration">Business Administration</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="semester" class="form-label small fw-semibold text-secondary">Semester</label>
              <select class="form-select" id="semester">
                <option value="1st Semester">1st Semester</option>
                <option value="2nd Semester">2nd Semester</option>
                <option value="3rd Semester">3rd Semester</option>
                <option value="4th Semester">4th Semester</option>
                <option value="5th Semester">5th Semester</option>
                <option value="6th Semester" selected>6th Semester</option>
                <option value="7th Semester">7th Semester</option>
                <option value="8th Semester">8th Semester</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="hostel_block" class="form-label small fw-semibold text-secondary">Hostel Block / Residence</label>
              <select class="form-select" id="hostel_block">
                <option value="Block A (Boys Hostel)">Block A (Boys Hostel)</option>
                <option value="Block B (Girls Hostel)">Block B (Girls Hostel)</option>
                <option value="Block C (Boys Hostel)">Block C (Boys Hostel)</option>
                <option value="Day Scholar">Day Scholar / Off-Campus</option>
              </select>
            </div>

            <div class="col-md-4">
              <label for="room_number" class="form-label small fw-semibold text-secondary">Room / Flat No.</label>
              <input type="text" class="form-control" id="room_number" placeholder="A-204">
            </div>
          </div>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" id="register-btn">
              <i class="fa-solid fa-user-plus me-2"></i>Complete Student Registration
            </button>
          </div>
        </form>

        <div class="text-center mt-4 pt-2 small text-secondary">
          Already registered? <a href="/login.html" class="text-primary fw-semibold text-decoration-none">Sign In Here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const alertBox = document.getElementById('register-alert');

      alertBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

      const payload = {
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value.trim(),
        roll_number: document.getElementById('roll_number').value.trim(),
        department: document.getElementById('department').value,
        semester: document.getElementById('semester').value,
        hostel_block: document.getElementById('hostel_block').value,
        room_number: document.getElementById('room_number').value.trim()
      };

      try {
        const response = await apiCall('/auth/register', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const { token, user } = response.data;
        Auth.setSession(token, user);
        UI.showToast('Registration successful! Welcome to Smart Campus.', 'success');

        setTimeout(() => {
          window.location.href = '/student/dashboard.html';
        }, 800);
      } catch (err) {
        alertBox.className = 'alert alert-danger py-2 small';
        alertBox.textContent = err.message || 'Registration failed. Please check your information.';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>Complete Student Registration';
      }
    });
  </script>
</body>
</html>
