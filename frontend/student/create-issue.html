<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Campus Issue | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="p-4 p-lg-5">
        <div class="mb-4">
          <a href="/student/dashboard.html" class="text-secondary small text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i>Back to Dashboard
          </a>
          <h3 class="fw-bold text-dark mt-2 mb-1">Report a Campus Issue</h3>
          <p class="text-secondary small mb-0">Submit a maintenance ticket with photo evidence to facility management.</p>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="card-custom p-4 p-sm-5">
              <form id="create-issue-form">
                <div class="row g-4">
                  <!-- Category & Priority -->
                  <div class="col-md-6">
                    <label for="category_id" class="form-label small fw-bold text-secondary">Campus Category *</label>
                    <select class="form-select" id="category_id" required>
                      <option value="" selected disabled>Loading categories...</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="priority" class="form-label small fw-bold text-secondary">Priority Level *</label>
                    <select class="form-select" id="priority" required>
                      <option value="low">Low - Minor cosmetic or non-blocking defect</option>
                      <option value="medium" selected>Medium - Normal malfunction affecting convenience</option>
                      <option value="high">High - Serious breakdown impacting academic schedule</option>
                      <option value="critical">Critical - Safety hazard, flooding, or power outage</option>
                    </select>
                  </div>

                  <!-- Location & Block -->
                  <div class="col-md-6">
                    <label for="block_area" class="form-label small fw-bold text-secondary">Campus Zone / Block *</label>
                    <select class="form-select" id="block_area" required>
                      <option value="" selected disabled>Select Campus Zone</option>
                      <option value="Block A">Block A (Boys Hostel / Academic)</option>
                      <option value="Block B">Block B (Girls Hostel / Seminars)</option>
                      <option value="Hostel Block C">Hostel Block C</option>
                      <option value="Tech Block">Tech Block &amp; Computer Laboratories</option>
                      <option value="North Campus">North Campus Grounds &amp; Perimeter</option>
                      <option value="Central Library">Central Library Building</option>
                      <option value="Cafeteria">Campus Food Court &amp; Cafeteria</option>
                      <option value="Sports Complex">Sports Complex &amp; Gymnasium</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="location" class="form-label small fw-bold text-secondary">Specific Location / Room *</label>
                    <input type="text" class="form-control" id="location" placeholder="e.g. 2nd Floor West Washroom, Room 204" required>
                  </div>

                  <!-- Title -->
                  <div class="col-12">
                    <label for="title" class="form-label small fw-bold text-secondary">Issue Title *</label>
                    <input type="text" class="form-control" id="title" placeholder="Brief summary of the issue (e.g. Water valve ruptured under washbasin)" required maxlength="200">
                  </div>

                  <!-- Description -->
                  <div class="col-12">
                    <label for="description" class="form-label small fw-bold text-secondary">Detailed Description *</label>
                    <textarea class="form-control" id="description" rows="4" placeholder="Describe symptoms, exact spot, hazard level, and when the issue started..." required></textarea>
                  </div>

                  <!-- Photo Upload with Preview -->
                  <div class="col-12">
                    <label class="form-label small fw-bold text-secondary">Attach Photo Evidence (Optional, max 5MB)</label>
                    <div class="p-4 border border-2 border-dashed rounded text-center bg-light" id="drop-zone">
                      <i class="fa-solid fa-cloud-arrow-up text-primary fs-2 mb-2"></i>
                      <div class="small fw-semibold text-dark">Click to browse or drag &amp; drop issue image</div>
                      <div class="text-muted" style="font-size: 0.75rem;">Supports JPG, PNG, WebP up to 5MB</div>
                      <input type="file" id="image-input" class="d-none" accept="image/jpeg,image/png,image/webp">
                      <div id="image-preview-wrapper" class="mt-3 d-none">
                        <img id="image-preview" src="#" alt="Upload Preview" class="img-thumbnail" style="max-height: 200px;">
                        <div class="mt-2">
                          <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearImagePreview()">Remove Photo</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Submit -->
                  <div class="col-12 text-end">
                    <a href="/student/dashboard.html" class="btn btn-light px-4 me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-5 fw-semibold shadow-sm" id="submit-btn">
                      <i class="fa-solid fa-paper-plane me-2"></i>Submit Issue
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script>
    if (Auth.requireAuth(['student'])) {
      Components.renderLayout('create-issue');
      initForm();
    }

    async function initForm() {
      // Load categories
      try {
        const res = await apiCall('/categories');
        const catSelect = document.getElementById('category_id');
        catSelect.innerHTML = '<option value="" selected disabled>Select Category</option>' +
          res.data.categories.map(c => `<option value="${c.id}">${UI.escapeHTML(c.name)}</option>`).join('');
      } catch (err) {
        UI.showToast('Could not load categories: ' + err.message, 'danger');
      }

      // Drag and drop / file preview handlers
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('image-input');
      const previewWrapper = document.getElementById('image-preview-wrapper');
      const previewImg = document.getElementById('image-preview');

      dropZone.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON') fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        if (fileInput.files && fileInput.files[0]) {
          const file = fileInput.files[0];
          const reader = new FileReader();
          reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewWrapper.classList.remove('d-none');
          };
          reader.readAsDataURL(file);
        }
      });
    }

    function clearImagePreview() {
      const fileInput = document.getElementById('image-input');
      fileInput.value = '';
      document.getElementById('image-preview-wrapper').classList.add('d-none');
    }

    document.getElementById('create-issue-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value.trim());
      formData.append('description', document.getElementById('description').value.trim());
      formData.append('category_id', document.getElementById('category_id').value);
      formData.append('priority', document.getElementById('priority').value);
      formData.append('block_area', document.getElementById('block_area').value);
      formData.append('location', document.getElementById('location').value.trim());

      const fileInput = document.getElementById('image-input');
      if (fileInput.files && fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      try {
        const res = await apiCall('/issues', {
          method: 'POST',
          body: formData
        });

        UI.showToast(`Issue ${res.data.tracking_code} submitted successfully!`, 'success');
        setTimeout(() => {
          window.location.href = `/student/issue-details.html?id=${res.data.id}`;
        }, 1000);
      } catch (err) {
        UI.showToast(err.message || 'Failed to submit issue', 'danger');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i>Submit Issue';
      }
    });
  </script>
</body>
</html>
