<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <main class="p-4 p-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h3 class="fw-bold text-dark mb-1">Notification Center</h3>
            <p class="text-secondary small mb-0">System alerts, assignment dispatches, and ticket resolution notices.</p>
          </div>
          <button class="btn btn-outline-primary btn-sm" onclick="markAllNotificationsRead()">
            <i class="fa-solid fa-check-double me-1"></i>Mark All as Read
          </button>
        </div>

        <div class="card-custom">
          <div class="list-group list-group-flush" id="notifications-list">
            <div class="p-5 text-center text-muted small">
              <span class="spinner-border spinner-border-sm me-2"></span>Loading notifications...
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script>
    if (Auth.requireAuth(['student'])) {
      Components.renderLayout('notifications');
      loadAllNotifications();
    }

    async function loadAllNotifications() {
      try {
        const res = await apiCall('/notifications');
        const { notifications } = res.data;
        const listContainer = document.getElementById('notifications-list');

        if (!notifications || notifications.length === 0) {
          listContainer.innerHTML = `<div class="p-5 text-center">${UI.renderEmptyState('No notifications', 'You have no alerts at this time.')}</div>`;
          return;
        }

        listContainer.innerHTML = notifications.map(n => `
          <div class="list-group-item p-3 d-flex align-items-start gap-3 ${!n.is_read ? 'bg-light border-start border-primary border-3' : ''}">
            <div class="rounded-circle p-2 bg-white border text-${n.type === 'danger' ? 'danger' : 'primary'} fs-5">
              <i class="fa-solid ${n.type === 'danger' ? 'fa-triangle-exclamation' : 'fa-bell'}"></i>
            </div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-center">
                <h6 class="fw-bold text-dark mb-1">${UI.escapeHTML(n.title)}</h6>
                <span class="text-muted small">${UI.formatTimeAgo(n.created_at)}</span>
              </div>
              <p class="text-secondary small mb-2">${UI.escapeHTML(n.message)}</p>
              ${n.issue_id ? `
                <a href="/student/issue-details.html?id=${n.issue_id}" class="btn btn-sm btn-outline-secondary py-0" style="font-size: 0.75rem;">
                  <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>Open Issue
                </a>
              ` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        UI.showToast('Failed to load notifications: ' + err.message, 'danger');
      }
    }

    async function markAllNotificationsRead() {
      try {
        await apiCall('/notifications/read-all', { method: 'PUT' });
        UI.showToast('All notifications marked as read', 'success');
        loadAllNotifications();
        Components.loadNotifications();
      } catch (err) {
        UI.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
